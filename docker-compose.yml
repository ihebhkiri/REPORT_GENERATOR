services : 
  postgres : 
    image : postgres:15.18-alpine 
    container_name : reportdb
    environment : 
      POSTGRES_USER : postgres
      POSTGRES_PASSWORD  : postgres 
      POSTGRES_DB : reportdb
    ports:  
     - "5432:5432"
    volumes : 
      - postgres_data:/var/lib/postgresql/data
volumes : 
  postgres_data: 
