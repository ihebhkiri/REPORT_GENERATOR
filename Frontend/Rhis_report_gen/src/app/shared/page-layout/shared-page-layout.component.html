<a class="skip-link" href="#page-content">Aller au contenu</a>
<header class="shared-header">
  <div class="header-top">
    <div class="brand">
      <img src="/Logo.svg" alt="RHIS" width="120" height="32" />
      <span>{{ isDatasets ? 'Administration' : 'Rapports' }}</span>
    </div>
    <nav aria-label="Navigation principale">
      <a routerLink="/rapports" [attr.aria-current]="isReports ? 'page' : null">
        <span class="pi pi-file" aria-hidden="true"></span>Rapports
      </a>
      <a routerLink="/assistant" [attr.aria-current]="page === 'assistant' ? 'page' : null">
        <span class="pi pi-sparkles" aria-hidden="true"></span>Assistant
      </a>
      @if (isAdmin()) {
        <a routerLink="/administration/datasets" [attr.aria-current]="isDatasets ? 'page' : null">
          <span class="pi pi-database" aria-hidden="true"></span>Données
        </a>
      }
    </nav>
    <div class="header-actions">
      @if (user()) {
        <span>
          <span></span>
        </span>
      }
    </div>
  </div>
  <div class="page-heading">
    <p class="breadcrumb">{{ pageCopy.breadcrumb }}</p>
    <h1 id="page-title">{{ pageCopy.title }}</h1>
    <p class="description">{{ pageCopy.description }}</p>
  </div>
</header>
<div id="page-content" tabindex="-1"><router-outlet /></div>
